name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Same pins as mise.toml, so CI and the dev container resolve modules the same way.
env:
  GOPROXY: https://proxy.golang.org
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: build, vet, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: golangci-lint
        run: golangci-lint run

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: goreleaser release --snapshot --clean --skip=sign   # signing happens in release.yml
      - name: smoke-test the linux/amd64 binary
        run: |
          ./dist/berth_linux_amd64_v1/berth --version
          ./dist/berth_linux_amd64_v1/berth >/dev/null
          if ./dist/berth_linux_amd64_v1/berth no-such-command >/dev/null; then exit 1; fi
      # The binaries berth may be installed from (plan: from CI artifacts only, never a workspace
      # build). Download: gh run download <run-id> -R ar4mirez/berth -n berth-<sha>. README has the steps.
      - name: upload the snapshot archives
        uses: actions/upload-artifact@v7
        with:
          # On pull requests github.sha is the temporary merge commit; name it after the head commit.
          name: berth-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
