name: integration

# Tests that need a real Docker daemon. The dev container has no Docker on purpose (docs/plan.md,
# "Dogfooding setup"), so these run here: on PRs, on main, or by hand with `gh workflow run integration`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: daemon
        run: |
          docker version
          docker compose version
      - name: build berth
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/berth" ./cmd/berth   # static, as releases are (goreleaser): it runs on other hosts (schedule --host)
          "$RUNNER_TEMP/berth" --version
      - name: integration tests (compose lifecycle, ssh host and remote lifecycle against sshd + dind, backup matrix)
        # go test stops a package after 10 minutes by default, and this one takes about that now
        # (the host guard on three engines, the host API): the job's own limit is the one that counts.
        run: BERTH_BIN="$RUNNER_TEMP/berth" go test -tags integration -count=1 -timeout 25m -v ./test/integration/...

  # The Engine API path (#43, BERTH_ENGINE_API=1): berth's org lifecycle, here and on a registered
  # host over SSH, with containers made through the engine's API instead of compose.
  engine-api:
    name: engine API path
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: build berth
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/berth" ./cmd/berth
      - name: the org lifecycle and compose compatibility, through the Engine API
        env:
          BERTH_ENGINE_API: "1"
        run: BERTH_BIN="$RUNNER_TEMP/berth" go test -tags integration -count=1 -timeout 20m -v -run 'TestRemoteLifecycle|TestEngineAPICompatibility' ./test/integration/...

  # berth serve as a service (#63), with the real service managers: systemd's user manager on Linux,
  # launchd on macOS. No container engine is needed: GET /v1 says only who is serving.
  service:
    name: service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: install, use, and uninstall the service
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/berth" ./cmd/berth
          export PATH="$HOME/.local/bin:$PATH"
          if [ "$(uname -s)" = Linux ]; then
            export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
            systemctl --user show-environment >/dev/null   # the runner has a user manager
            sock="$XDG_RUNTIME_DIR/berth.sock"
          else
            sock="$HOME/.config/berth/berth.sock"
          fi
          if berth system service status; then echo "a service was there before the test"; exit 1; fi
          berth system service install
          for _ in $(seq 1 30); do [ -S "$sock" ] && break; sleep 1; done
          curl -fsS --unix-socket "$sock" http://berth/v1 | tee /tmp/v1.json
          grep -q '"schema": "berth.api/v1"' /tmp/v1.json
          berth system service status
          berth system service logs | tail -5
          # Installing again applies the unit and leaves it running.
          berth system service install >/dev/null
          for _ in $(seq 1 30); do curl -fsS --unix-socket "$sock" http://berth/v1 >/dev/null 2>&1 && break; sleep 1; done
          berth system service status
          berth system service uninstall
          if berth system service status; then echo "still installed"; exit 1; fi
          if curl -fsS -m 3 --unix-socket "$sock" http://berth/v1 2>/dev/null; then echo "still serving"; exit 1; fi
          echo "ok: the service installs, serves, and goes away"
      - name: the whole machine's service (--system), with root's systemd
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH" XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          if berth system service install --system; then echo "installed without root"; exit 1; fi
          sudo "$HOME/.local/bin/berth" system service install --system
          grep -qx "User=$(id -un)" /etc/systemd/system/berth-serve.service
          # No runtime directory for a system service: it listens in berth's config directory, and
          # this user's commands find it there although $XDG_RUNTIME_DIR is set.
          sock="$HOME/.config/berth/berth.sock"
          for _ in $(seq 1 30); do [ -S "$sock" ] && break; sleep 1; done
          curl -fsS --unix-socket "$sock" http://berth/v1 | grep -q '"schema": "berth.api/v1"'
          test ! -e "$XDG_RUNTIME_DIR/berth.sock"
          berth --via-daemon --output json host ls | grep -q '"schema": "berth.hosts/v1"'
          berth system service status --system
          if berth system service status; then echo "the user's status claims the system unit"; exit 1; fi
          sudo "$HOME/.local/bin/berth" system service logs --system | tail -5
          sudo "$HOME/.local/bin/berth" system service uninstall --system
          if berth system service status --system; then echo "still installed"; exit 1; fi
          echo "ok: the system service installs as this user, serves, and goes away"
      - name: the backup schedule as a launchd agent
        if: runner.os == 'macOS'
        env:
          # A recipient instead of a key (berth backup keygen needs Docker, which this runner hasn't).
          BERTH_BACKUP_RECIPIENTS: age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          agent="gui/$(id -u)/dev.berth.backup"
          # A cron line from an older berth is replaced, and the user's own lines stay.
          (crontab -l 2>/dev/null || true; echo "5 4 * * * true  # mine"; echo "0 3 * * * true  # berth-backup") | crontab -
          berth backup schedule on --at 04:30 --keep 3
          if crontab -l | grep -q "# berth-backup"; then echo "the cron line stayed"; exit 1; fi
          crontab -l | grep -q "# mine"
          launchctl print "$agent" | grep -q "state = "
          berth backup schedule status | tee /tmp/status
          grep -q "daily at 04:30 (launchd agent dev.berth.backup)" /tmp/status
          # run starts the job now: it writes its log (the backup itself fails without Docker).
          berth backup schedule run
          for _ in $(seq 1 30); do [ -s "$HOME/Library/Logs/berth/backup.log" ] && break; sleep 1; done
          test -s "$HOME/Library/Logs/berth/backup.log"
          berth --output json backup schedule status | grep -q '"kind": "launchd"'
          berth backup schedule off
          test ! -e "$HOME/Library/LaunchAgents/dev.berth.backup.plist"
          if launchctl print "$agent" >/dev/null 2>&1; then echo "the agent is still loaded"; exit 1; fi
          crontab -l | grep -v "# mine" | crontab - || true
          echo "ok: the schedule loads as a launchd agent, runs, and goes away"

  # Podman (#57): the org lifecycle and backups on Podman, rootless (this user) and rootful (root).
  # `podman compose` runs Docker's compose against Podman's API socket, which is started here.
  podman:
    name: podman (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [rootless, rootful]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: build berth and the test binary
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/berth" ./cmd/berth
          go test -c -tags integration -o "$RUNNER_TEMP/itest" ./test/integration
      - name: podman, and its API socket
        run: |
          podman version
          echo "PODMAN_COMPOSE_PROVIDER=/usr/libexec/docker/cli-plugins/docker-compose" >> "$GITHUB_ENV"
          echo "PODMAN_COMPOSE_WARNING_LOGS=false" >> "$GITHUB_ENV"
          if [ "${{ matrix.mode }}" = rootless ]; then
            mkdir -p "$XDG_RUNTIME_DIR/podman"
            (podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman/podman.sock" &)
            podman info --format 'rootless={{.Host.Security.Rootless}} cgroups={{.Host.CgroupsVersion}} network={{.Host.NetworkBackend}}'
          else
            (sudo podman system service --time=0 unix:///run/podman/podman.sock &)
            sudo podman info --format 'rootless={{.Host.Security.Rootless}} cgroups={{.Host.CgroupsVersion}} network={{.Host.NetworkBackend}}'
          fi
          sleep 2
      - name: the lifecycle on podman (${{ matrix.mode }})
        run: |
          cd test/integration
          export BERTH_BIN="$RUNNER_TEMP/berth" BERTH_ENGINE=podman
          if [ "${{ matrix.mode }}" = rootless ]; then
            "$RUNNER_TEMP/itest" -test.run 'TestEngineLifecycle' -test.v -test.count=1
          else
            sudo --preserve-env=BERTH_BIN,BERTH_ENGINE,PODMAN_COMPOSE_PROVIDER,PODMAN_COMPOSE_WARNING_LOGS,PATH \
              "$RUNNER_TEMP/itest" -test.run 'TestEngineLifecycle' -test.v -test.count=1
          fi
