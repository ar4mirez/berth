name: docs

# The docs site (#56): built from docs/ with MkDocs (mkdocs.yml, pinned with hashes in
# tools/docs/requirements.txt) and published with GitHub Pages from main. --strict fails on any
# broken link or anchor between pages. The command reference is generated from the commands' help;
# ci's TestCommandReferenceIsCurrent fails when docs/reference/commands is stale.
#
# On main the site also carries berth's apt and yum repositories (#60), at /apt and /rpm: built here
# from the latest releases' packages (each verified against its release's signature) and signed
# with PACKAGES_GPG_KEY. The release workflow runs this one after it publishes.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "tools/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: MkDocs (pinned, with hashes)
        run: pip install --require-hashes -r tools/docs/requirements.txt
      - name: "build (--strict: a broken link fails it)"
        run: mkdocs build --strict -d site
      - uses: jdx/mise-action@v5
        if: github.ref == 'refs/heads/main'
      - name: apt and yum repositories (signed), from the latest releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          GOPROXY: https://proxy.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES_GPG_KEY" ]; then echo "::warning::no PACKAGES_GPG_KEY: the site is published without the apt and yum repositories"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c gnupg >/dev/null
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import <<<"$PACKAGES_GPG_KEY"
          tools/pkgrepo/fetch.sh "$RUNNER_TEMP/pkgs"
          tools/pkgrepo/build.sh "$RUNNER_TEMP/pkgs" site
          # What users will check: the signature, with the public key the site serves.
          gpg --no-default-keyring --keyring site/apt/berth.gpg --verify site/apt/dists/stable/InRelease
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
