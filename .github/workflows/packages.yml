name: packages

# Every install channel (#60), on a clean machine:
#   - the .deb, .rpm and Arch packages of a snapshot build, in debian, ubuntu, fedora and archlinux
#     containers: installed with the distro's own tool, with man pages and completion in place, and
#     berth upgrade deferring to the package manager;
#   - the generated AUR PKGBUILDs, checked with makepkg;
#   - install.sh against the latest release, on Linux and macOS: it installs with the signature and
#     checksum checked, and refuses a tampered archive;
#   - mise (its github: backend) against the latest release, asking GitHub for it directly (mise's own versions
#     host can lag a new release; that only warns);
#   - the apt and yum repositories: built from the snapshot's packages with a throwaway key and
#     installed from on Debian, Ubuntu and Fedora, with a tampered copy refused; and the published
#     ones, as the docs tell users to add them (the PKG_REPO repository variable);
#   - Homebrew and the AUR once they're published (the HOMEBREW_TAP / AUR repository variables).
# Weekly as well, so a channel that breaks between releases shows up.
on:
  pull_request:
    paths: [".goreleaser.yaml", "install.sh", "internal/docgen/**", "tools/gendocs/**", "tools/pkgrepo/**", ".github/workflows/packages.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: goreleaser release --snapshot --clean --skip=sign
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/aur/*.pkgbuild
          retention-days: 3

  native:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "debian:stable-slim", install: "apt-get update -qq && apt-get install -y -qq ./pkgs/berth_*_amd64.deb man-db"}
          - {image: "ubuntu:24.04", install: "apt-get update -qq && apt-get install -y -qq ./pkgs/berth_*_amd64.deb man-db"}
          - {image: "fedora:latest", install: "dnf install -y -q ./pkgs/berth-*.x86_64.rpm man-db"}
          - {image: "archlinux:latest", install: "pacman -Sy --noconfirm --needed man-db && pacman -U --noconfirm ./pkgs/berth-*-x86_64.pkg.tar.zst"}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: pkgs
      - name: install (${{ matrix.image }})
        run: ${{ matrix.install }}
      - name: check
        shell: sh
        run: |
          set -eux
          command -v berth
          berth --version
          test -f /usr/share/man/man1/berth.1 && test -f /usr/share/man/man1/berth-org-up.1
          test -f /usr/share/bash-completion/completions/berth
          test -f /usr/share/zsh/site-functions/_berth
          test -f /usr/share/fish/vendor_completions.d/berth.fish
          test -f /usr/share/licenses/berth/LICENSE
          # A package manager's install is upgraded there, not by berth upgrade.
          if out=$(berth system upgrade 2>&1); then echo "berth upgrade didn't defer: $out"; exit 1; fi
          echo "$out" | grep -q "package manager"

  # The apt and yum repositories (tools/pkgrepo): built, signed and installed from, end to end.
  repository:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: pkgs
      - run: tools/pkgrepo/test.sh pkgs

  # The published repositories, added exactly as docs/getting-started.md says.
  repository-published:
    if: vars.PKG_REPO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "debian:stable-slim"
            install: |
              apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
              install -d -m 755 /etc/apt/keyrings
              curl -fsSL -o /etc/apt/keyrings/berth.gpg https://ar4mirez.github.io/berth/apt/berth.gpg
              echo "deb [signed-by=/etc/apt/keyrings/berth.gpg] https://ar4mirez.github.io/berth/apt stable main" > /etc/apt/sources.list.d/berth.list
              apt-get update -qq && apt-get install -y -qq berth
          - image: "ubuntu:24.04"
            install: |
              apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
              install -d -m 755 /etc/apt/keyrings
              curl -fsSL -o /etc/apt/keyrings/berth.gpg https://ar4mirez.github.io/berth/apt/berth.gpg
              echo "deb [signed-by=/etc/apt/keyrings/berth.gpg] https://ar4mirez.github.io/berth/apt stable main" > /etc/apt/sources.list.d/berth.list
              apt-get update -qq && apt-get install -y -qq berth
          - image: "fedora:latest"
            install: |
              curl -fsSL -o /etc/yum.repos.d/berth.repo https://ar4mirez.github.io/berth/rpm/berth.repo
              dnf install -y -q berth
    container: ${{ matrix.image }}
    steps:
      - name: install from the repository (${{ matrix.image }})
        run: ${{ matrix.install }}
      - name: the latest release is what was installed
        shell: sh
        run: |
          set -eu
          command -v curl >/dev/null || dnf install -y -q curl
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/ar4mirez/berth/releases/latest); latest=${latest##*/v}
          got=$(berth --version); echo "$got"
          case "$got" in "berth $latest "*) ;; *) echo "the repository has that, and the latest release is $latest"; exit 1 ;; esac

  aur:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: pkgs
      - name: makepkg reads both PKGBUILDs
        run: |
          pacman -Sy --noconfirm --needed base-devel >/dev/null
          useradd -m builder
          for p in berth-bin berth; do
            d=/home/builder/$p; mkdir -p "$d"; cp "pkgs/aur/$p.pkgbuild" "$d/PKGBUILD"; chown -R builder "$d"
            su builder -c "cd $d && makepkg --printsrcinfo" | grep -q "pkgname = $p"
          done

  install-script:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v3
      - name: install the latest release (signature and checksum checked)
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          sh install.sh
          "$HOME/.local/bin/berth" --version
      - name: a tampered archive is refused
        run: |
          set -u
          v=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/ar4mirez/berth/releases/latest); v=${v##*/}
          os=$(uname -s | tr A-Z a-z); arch=$(uname -m); case $arch in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          m="$RUNNER_TEMP/mirror/$v"; mkdir -p "$m"
          for f in "berth_${v#v}_${os}_${arch}.tar.gz" checksums.txt checksums.txt.sigstore.json; do
            curl -fsSL -o "$m/$f" "https://github.com/ar4mirez/berth/releases/download/$v/$f"
          done
          printf 'x' >> "$m/berth_${v#v}_${os}_${arch}.tar.gz"
          export HOME="$RUNNER_TEMP/home2" && mkdir -p "$HOME"
          if BERTH_INSTALL_BASE="file://$RUNNER_TEMP/mirror" sh install.sh --version "$v" 2>err.txt; then
            echo "a tampered archive was installed"; exit 1
          fi
          grep -q "doesn't match its checksum" err.txt
          test ! -e "$HOME/.local/bin/berth"

  mise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: jdx/mise-action@v5
        with:
          install: false
      # mise's versions host caches each tool's release list and can lag a new release by up to a
      # day: right after v0.4.1 this job installed 0.3.0 (#102). Asking GitHub directly, the latest
      # release is what must be installed. mise also holds a new release back by default
      # (minimum_release_age): right after v0.5.0 this job installed 0.4.1.
      - name: mise installs the latest release
        env:
          MISE_USE_VERSIONS_HOST: "0"
          MISE_MINIMUM_RELEASE_AGE: "0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/ar4mirez/berth/releases/latest); latest=${latest##*/v}
          # The github: backend, as the docs say (mise deprecated ubi:). It must pick the archive, not
          # the .deb or .rpm beside it, and it checks the release's attestation before installing.
          # Verbose: mise only prints its verification steps that way when its output isn't a terminal.
          MISE_VERBOSE=1 mise use -g github:ar4mirez/berth 2>&1 | tee use.log
          got=$(mise exec -- berth --version)
          echo "$got"
          case "$got" in "berth $latest "*) ;; *) echo "mise installed that, and the latest release is $latest"; exit 1 ;; esac
          grep -qi "attestations verified" use.log || echo "::warning::mise didn't report verifying berth's GitHub artifact attestation: check docs/getting-started.md's claim (mise may have reworded it)"
      # What a user gets by default, through the versions host. A lag there isn't berth's to fix, so
      # it is a warning on the run, not a failure.
      - name: what mise resolves by default
        run: |
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/ar4mirez/berth/releases/latest); latest=${latest##*/v}
          seen=$(mise ls-remote github:ar4mirez/berth | tail -1)
          echo "the latest release is $latest; mise's versions host lists up to $seen"
          [ "$seen" = "$latest" ] || echo "::warning::mise's versions host lags: it lists $seen, and the latest release is $latest (docs/getting-started.md says how to pin)"

  homebrew:
    if: vars.HOMEBREW_TAP == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - run: |
          brew install --cask ar4mirez/tap/berth
          berth --version
          man -w berth

  aur-published:
    if: vars.AUR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - run: |
          pacman -Sy --noconfirm --needed base-devel git >/dev/null
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          su builder -c 'cd ~ && git clone https://aur.archlinux.org/berth-bin.git && cd berth-bin && makepkg -si --noconfirm'
          berth --version
