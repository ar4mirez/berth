# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: berth

builds:
  - id: berth
    main: ./cmd/berth
    binary: berth
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ar4mirez/berth/internal/version.Version={{ .Version }}
      - -X github.com/ar4mirez/berth/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/ar4mirez/berth/internal/version.Date={{ .Date }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: berth
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true

release:
  disable: true
