version: "2"

# Lint the Docker-only tests too, even though a plain build skips them.
run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    # Org state is only touched through host.FS / host.Execer (CLAUDE.md, "Hard rules").
    # internal/host/local is the one package allowed to call these; see the exclusion below.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Create|CreateTemp|Open|OpenFile|OpenRoot|OpenInRoot|ReadFile|WriteFile|ReadDir|DirFS|CopyFS|Mkdir|MkdirAll|MkdirTemp|Remove|RemoveAll|Rename|Chmod|Chown|Lchown|Chtimes|Link|Symlink|Readlink|Truncate|Stat|Lstat)$
          pkg: ^os$
          msg: go through host.FS (only internal/host/local may use os file I/O)
        - pattern: ^ioutil\.
          pkg: ^io/ioutil$
          msg: go through host.FS (only internal/host/local may use os file I/O)
        - pattern: ^exec\.Command(Context)?$
          pkg: ^os/exec$
          msg: go through host.Execer (only internal/host/local may start processes)
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo]
      - path: ^internal/host/local/
        linters: [forbidigo]
      - path: ^test/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ar4mirez/berth
